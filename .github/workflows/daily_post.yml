name: Daily Data Analytics Post

on:
  schedule:
    # 05:00 UTC là 12:00 trưa giờ Việt Nam (UTC+7)
    - cron: '0 5 * * *'
  workflow_dispatch: # Cho phép chạy thủ công từ tab Actions

jobs:
  run-auto-poster:
    runs-on: ubuntu-latest
    
    # Cấp quyền ghi để action có thể commit file mới vào repo
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run script to fetch, generate and post
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          TEST_MODE: "false" # Chạy thật khi ở trên GitHub Actions
        run: python main.py
        
      - name: Commit new post to GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posts/
          git diff-index --quiet HEAD || git commit -m "📝 Thêm bài đăng mới ngày $(date +'%Y-%m-%d')"
          git push
